name: Generate social preview PNG
on:
  push:
    branches: [main]
    paths:
      - 'og-preview.svg'
      - '.github/workflows/social-preview-png.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Convert SVG preview to PNG
        run: |
          python -m pip install --upgrade pip
          python -m pip install cairosvg
          python - <<'PY'
          import cairosvg
          cairosvg.svg2png(url='og-preview.svg', write_to='og-preview.png', output_width=1200, output_height=630)
          PY
      - name: Commit PNG if changed
        run: |
          if git diff --quiet -- og-preview.png; then
            echo "PNG is already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add og-preview.png
          git commit -m "Generate PNG social preview"
          git push
